name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Build with Gradle
      run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
    - name: Validate update release metadata generation
      run: node --test scripts/create-update-release.test.mjs
